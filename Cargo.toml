[workspace]
resolver = "3"
members = [
   "layer0",
   "turn/skg-tool",
   "turn/skg-tool-macro",
   "turn/skg-turn",
   "op/skg-context-engine",
   "op/skg-op-compute-runtime",
   "state/skg-state-memory",
   "state/skg-state-fs",
   "provider/skg-provider-anthropic",
   "provider/skg-provider-openai",
   "provider/skg-provider-ollama",
   "secret/skg-secret",
   "auth/skg-auth",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/secbear/skelegent"
homepage = "https://github.com/secbear/skelegent"
