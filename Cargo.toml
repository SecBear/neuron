  "layer0",
  "turn/skg-tool",
  "turn/skg-tool-macro",
  "turn/skg-turn",
  "op/skg-context-engine",
  "op/skg-op-compute-runtime",
  "state/skg-state-memory",
  "state/skg-state-fs",
  "provider/skg-provider-anthropic",
  "provider/skg-provider-openai",
  "provider/skg-provider-ollama",
  "secret/skg-secret",
  "auth/skg-auth",

  # Temporarily excluded during v2 architecture rebuild.
