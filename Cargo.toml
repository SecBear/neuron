  # Uncomment as each is migrated to new Operator trait.
  # "skelegent",
  # "env/skg-env-local",
  # "orch/skg-orch-local",
  # "orch/skg-orch-kit",
  # "orch/skg-orch-patterns",
  # "op/skg-op-single-shot",
  # "turn/skg-mcp",
  # "effects/skg-effects-core",
  # "effects/skg-effects-local",
  # "examples/custom_operator_barrier",
  # "examples/middleware_echo",
  # "examples/middleware_approval",
  # "examples/echo-agent",
  # "examples/workflow",
  # "examples/react-chatbot",
  # "examples/multi-agent",
  # "examples/compute-python-poc",
]

[workspace.package]
edition = "2024"
