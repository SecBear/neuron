[package]
name = "skg-env-local"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Local (no-isolation) environment provider for skelegent"

[dependencies]
layer0 = { path = "../../layer0" }
async-trait = "0.1"

[dev-dependencies]
layer0 = { path = "../../layer0", features = ["test-utils"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
